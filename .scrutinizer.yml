build:
    environment:
        php:
            version: 8.1

    dependencies:
        before:
            - composer self-update --2 || true
        override:
            - composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-zip

    nodes:
        analysis:
            project_setup:
                override:
                    - 'true'
            tests:
                override:
                    - php-scrutinizer-run

filter:
    excluded_paths:
        - 'tests/*'

checks:
    php: true

coding_style:
    php:
        spaces:
            around_operators:
                concatenation: true
