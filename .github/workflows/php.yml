name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions: ['8.1', '8.2', '8.3']
        
    runs-on: ${{ matrix.operating-system }}

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.php-versions }}-${{ hashFiles('**/composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-versions }}-

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress

    - name: Run PHP-CS-Fixer
      run: composer cs:check

    - name: Run PHPStan
      run: composer phpstan

    - name: Run Rector
      run: composer rector:check

    - name: Create env
      run: php qt core:env

    - name: Create app key
      run: php qt core:key --length=64

    - name: Run tests
      run: composer test

    - name: Generate the demo API module
      run: php qt module:generate Api --template=DemoApi --yes

    - name: Smoke test the API
      run: |
        php qt serve --host=127.0.0.1 --port=8000 > server.log 2>&1 &
        for i in $(seq 1 20); do
          curl -s -o /dev/null http://127.0.0.1:8000/ && break
          sleep 1
        done
        status=$(curl -s -o response.json -w '%{http_code}' http://127.0.0.1:8000/api/posts)
        echo "GET /api/posts returned $status"
        cat response.json
        echo
        if [ "$status" != "200" ]; then
          echo "Expected 200. Server log:"
          cat server.log
          exit 1
        fi
        grep -q '"status":"success"' response.json
